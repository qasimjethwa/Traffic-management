name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "src/data/reference/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "src/data/reference/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mumbai_flow
          POSTGRES_PASSWORD: mumbai_flow
          POSTGRES_DB: mumbai_flow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mumbai_flow" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MF_TEST_DATABASE_URL: postgresql+psycopg://mumbai_flow:mumbai_flow@localhost:5432/mumbai_flow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        env:
          MF_DATABASE_URL: ${{ env.MF_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q
